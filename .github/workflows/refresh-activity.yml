name: Refresh profile activity chart

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate chart
        run: python scripts/update_push_activity.py
      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/push-activity.svg; then
            echo "Activity chart is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/push-activity.svg
          git commit -m "Refresh public push activity chart"
          git push
