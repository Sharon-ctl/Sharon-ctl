name: Refresh profile project monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Regenerate chart
        run: python scripts/update_push_activity.py
      - name: Refresh original project status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_project_status.py
      - name: Commit updated dashboard
        run: |
          if git diff --quiet -- README.md assets/push-activity.svg; then
            echo "Project dashboard is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md assets/push-activity.svg
          git commit -m "Refresh live profile project status"
          git push
